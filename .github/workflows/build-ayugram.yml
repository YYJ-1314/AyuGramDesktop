name: Build AyuGram (download boost)

on:
  workflow_dispatch:

env:
  PREPARE_PATH: Telegram/build/prepare/prepare.py
  MSBUILDDISABLENODEREUSE: 1
  MSBUILDNOINPROCNODE: 1

jobs:

  prepare:
    name: Prepare libraries (slow first run, then cached)
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Install ATL component (best effort, runner image lacks it).
        shell: pwsh
        continue-on-error: true
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vs_installer.exe"
          )
          $installer = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installer) { Write-Host "vs_installer.exe not found, skip"; exit 0 }
          $vs = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vs) { Write-Host "Visual Studio not found, skip"; exit 0 }
          Write-Host "Installing ATL into $($vs.FullName)"
          & $installer modify --installPath "$($vs.FullName)" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache
          Write-Host "vs_installer exit=$LASTEXITCODE"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-rel-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-rel-

      - name: Free up disk space before libraries.
        shell: bash
        run: |
          echo '=== disk before ==='
          df -h /c 2>/dev/null || true
          for d in \
            "/c/Android" "/c/Program Files/Android" "/c/Program Files (x86)/Android" \
            "/c/Program Files/Boost" "/c/Program Files/Eclipse" \
            "/c/hostedtoolcache/windows/Go" "/c/hostedtoolcache/windows/Ruby" \
            "/c/hostedtoolcache/windows/Java_Television" \
            "/c/Program Files/Julia" "/c/Miniconda" "/c/Anaconda" \
            "/c/Program Files/MongoDB" "/c/Program Files/MySQL" \
            "/c/Program Files/PostgreSQL" "/c/Program Files/Microsoft SQL Server" \
            "/c/Program Files/dotnet/sdk" \
          ; do
            if [ -d "$d" ]; then rm -rf "$d" 2>/dev/null && echo "removed $d"; fi
          done
          rm -rf /c/Windows/SoftwareDistribution/Download/* 2>/dev/null || true
          echo '=== disk after ==='
          df -h /c 2>/dev/null || true

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

  build:
    name: Build AyuGram.exe
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-rel-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-rel-

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 qt6 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --parallel

      - name: Locate artifact.
        shell: bash
        run: |
          EXE=$(find "$TBUILD/$REPO_NAME/out" -type f -name 'AyuGram.exe' | head -1)
          if [ -z "$EXE" ]; then
            echo "AyuGram.exe not found under out/"
            find "$TBUILD/$REPO_NAME/out" -maxdepth 3 -type d | head -20
            exit 1
          fi
          echo "Found: $EXE"
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV

      - name: Move artifact.
        run: |
          mkdir artifact
          move "%EXE_PATH%" artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: AyuGram-download-boost
          path: artifact\
          retention-days: 30
